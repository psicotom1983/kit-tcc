<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit TCC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Kit Clínico TCC</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1f2328;--muted:#5f6670;--line:#e1ded7;--accent:#2f6f6a;--on-accent:#fff;--accent-soft:#e3efed;--warn:#8a5200;--warn-soft:#fff3dc;--danger:#b42318;--danger-soft:#fde8e8;--ok:#1f7a35;--ok-soft:#e3f4e6;--chip:#efede8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1d2024;--ink:#e6e6e3;--muted:#9aa1a9;--line:#30343a;--accent:#6fb8b0;--on-accent:#0f1a19;--accent-soft:#1f3432;--warn:#e0a84a;--warn-soft:#3a2d16;--danger:#ff8a8a;--danger-soft:#3d1d1d;--ok:#7fd48f;--ok-soft:#1b331f;--chip:#272b30}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1d2024;--ink:#e6e6e3;--muted:#9aa1a9;--line:#30343a;--accent:#6fb8b0;--on-accent:#0f1a19;--accent-soft:#1f3432;--warn:#e0a84a;--warn-soft:#3a2d16;--danger:#ff8a8a;--danger-soft:#3d1d1d;--ok:#7fd48f;--ok-soft:#1b331f;--chip:#272b30;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body.fs-g{zoom:1.1}body.fs-gg{zoom:1.22}
.lit{font-size:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent)}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15.5px;margin:0 0 8px}h4{margin:8px 0 4px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;white-space:nowrap}
.sp{flex:1}
/* indicador de salvamento — centralizado e discreto */
.flag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;padding:4px 12px 4px 5px;border-radius:999px;cursor:pointer;max-width:min(420px,52vw);white-space:nowrap}
.flag .fi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;flex:none}
.flag .ft{overflow:hidden;text-overflow:ellipsis}
.flag.ok .fi{background:var(--ok)}.flag.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.flag.bad .fi{background:var(--danger)}.flag.bad{color:var(--danger);border-color:var(--danger)}
.flag.saving .fi{background:var(--warn);animation:spin 1.2s linear infinite}
.flag.warn .fi{background:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{padding:8px 16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button.banner[hidden]{display:none}button.banner{width:100%;border:0;justify-content:center;font:inherit;font-size:13px;padding:5px 16px;cursor:pointer}.banner.bad{background:var(--danger-soft);color:var(--danger);border-bottom:1px solid var(--danger)}
.wrap{display:flex;min-height:calc(100vh - 54px)}
nav{width:210px;flex:none;padding:14px 10px;border-right:1px solid var(--line);background:var(--panel)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:var(--chip)}nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{flex:1;min-width:0;padding:20px 26px 110px;max-width:1120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.ph h1{margin:0}
.muted{color:var(--muted)}small{color:var(--muted)}
.f{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;min-width:0}.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.g6{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:7px 13px;border-radius:8px;cursor:pointer;text-decoration:none;min-height:36px}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.del{color:var(--danger)}.btn.sm{font-size:12.5px;padding:4px 9px;min-height:30px}.btn:disabled{opacity:.5;cursor:default}
.btn.big{width:100%;min-height:44px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;margin:0 4px 6px 0;color:inherit;font-family:inherit}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.used{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.next{outline:2px solid var(--warn);outline-offset:1px}
/* seletor de técnicas — quadradinhos no estilo dos campos */
.tp{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg)}
.sq{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:inherit;font:inherit;font-size:13.5px;border-radius:7px;padding:7px 10px;margin:0 6px 6px 0;cursor:pointer;text-align:left}
.sq.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.sq.add{border-style:dashed;color:var(--accent)}
.sq .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0 0 0 4px}
.sq .warnref{color:var(--danger);font-size:12px;text-decoration:none;font-weight:600}
.tp-sel{margin-bottom:6px}.tp-bar input{flex:1}.tp-res{margin-top:8px}.tp-res:empty{display:none}
.tp-all{margin-top:10px;max-height:340px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.tp-gt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 6px}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin:0 4px 4px 0}
.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.accent{background:var(--accent-soft);color:var(--accent)}.badge.ok{background:var(--ok-soft);color:var(--ok)}
.alert{border-radius:10px;padding:12px 16px;margin:0 0 14px;border:1px solid}
.alert.danger{background:var(--danger-soft);border-color:var(--danger)}.alert.danger>b:first-child{color:var(--danger)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.alert ul{margin:6px 0;padding-left:20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:8px 0 16px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font:inherit;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{cursor:pointer;margin:0}.pcard:hover{border-color:var(--accent)}
details.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
details.item>summary{padding:11px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::before{content:"▸";color:var(--muted)}details.item[open]>summary::before{content:"▾"}
details.item>.body{padding:4px 14px 14px;border-top:1px solid var(--line)}
.sum-meta{font-weight:400;color:var(--muted);font-size:13px}
.ref{color:var(--muted);font-size:12.5px}
ol.refs{padding-left:20px;margin:6px 0}ol.refs li{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:14px}.chk input{width:auto;transform:scale(1.15)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.steps{display:flex;flex-direction:column;gap:6px}.steps .arrow{color:var(--muted);text-align:center;font-size:13px}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.phase{border-left:3px solid var(--line);padding:2px 0 6px 12px;margin:0 0 10px}.phase.cur{border-color:var(--warn)}
.infobtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;width:22px;height:22px;line-height:19px;padding:0;font-size:13px;font-weight:700;cursor:pointer;margin-left:5px;vertical-align:1px}
.interp{color:var(--accent);font-weight:600}
.plist{list-style:none;padding:0;margin:0}.plist>li{padding:10px 0;border-bottom:1px solid var(--line)}.plist>li:last-child{border-bottom:0}
.plist input{font-size:13.5px;padding:6px 8px}
.alert .plist>li{border-color:rgba(127,127,127,.25)}
.prow{display:flex;gap:12px;align-items:center;justify-content:space-between}.ptxt{flex:1;min-width:0}
.psel{width:auto;flex:none;max-width:200px;font-size:13.5px;padding:6px 8px;background:var(--panel)}
.psel.ok{border-color:var(--ok);color:var(--ok)}.psel.danger{border-color:var(--danger);color:var(--danger)}.psel.warn{border-color:var(--warn);color:var(--warn)}.psel.accent{border-color:var(--accent);color:var(--accent)}
.pnota{margin-top:6px}
.phist summary{cursor:pointer;margin-top:2px;list-style:none}.phist summary::-webkit-details-marker{display:none}
@media(max-width:560px){.prow{flex-direction:column;align-items:stretch;gap:6px}.psel{max-width:none;width:100%}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.recrow{margin-top:10px}
.doc .dic{font-size:22px;line-height:1}.doc .dnm{font-weight:600;word-break:break-word}
.lock{display:grid;place-items:center;min-height:100vh;padding:16px}
.lockbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:440px;width:100%}
.err{color:var(--danger);min-height:1.4em;margin:6px 0 0}
.reccode{font:600 20px/1.5 ui-monospace,Consolas,monospace;letter-spacing:1.5px;background:var(--bg);border:2px dashed var(--accent);border-radius:10px;padding:14px;text-align:center;margin:12px 0;word-break:break-all}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12.5px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:720px;width:calc(100% - 24px);max-height:calc(100vh - 40px);padding:20px 22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
/* confirmação dupla em posições diferentes */
.cdlg{max-width:420px}
.cdlg.pos-top{margin-top:12vh}
.cdlg.pos-bottom{margin-bottom:10vh;margin-top:auto}
/* botão salvar flutuante (longe dos botões de excluir) */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;border:0;background:var(--accent);color:var(--on-accent);font:600 14px/1 inherit;font-family:inherit;padding:13px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.fab:disabled{opacity:.6}
body.recording .fab{bottom:calc(92px + env(safe-area-inset-bottom))}
body.ia-open .fab{display:none}
/* barra de gravação */
#recBar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#7a1010;color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#recBar .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
#recBar .dot{width:12px;height:12px;border-radius:50%;background:#ffb3b3;flex:none}#recBar .dot.on{background:#ff4d4d;animation:pulse 1s infinite}
#recBar .interim{font-size:13px;opacity:.85;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.35}}
body.recording main{padding-bottom:170px}
/* painel de IA */
#ia{display:none}
body.ia-open #ia{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:30;background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top)}
@media(min-width:1100px){body.ia-open .wrap{margin-right:440px}}
.ia-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ia-sub{padding:8px 12px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ia-sub select{width:auto;flex:1;font-size:13px;padding:4px 6px}
.ia-msgs{flex:1;overflow:auto;padding:8px 12px}
.ia-msg{padding:10px 12px;border-radius:10px;margin:0 0 10px;font-size:14px;word-wrap:break-word}
.ia-msg.user{background:var(--accent-soft);margin-left:30px}.ia-msg.assistant{background:var(--bg);border:1px solid var(--line)}
.ia-msg ul{padding-left:20px;margin:6px 0}.ia-msg h3,.ia-msg h4{margin:8px 0 4px}
.ia-sugs{display:flex;flex-direction:column;align-items:flex-start;margin-top:8px}
.ia-foot{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.dc{min-height:84px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.dc.out{opacity:.45}.dc.sel{outline:2px solid var(--accent);outline-offset:-1px}
.dc .dn{font-size:12px;font-weight:700;width:22px;height:22px;display:grid;place-items:center;flex:none}
.dc.hoje .dn{background:var(--accent);color:var(--on-accent);border-radius:50%}
.dc .ev{font-size:11px;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--accent)}
.ev.supervisao{background:var(--warn-soft);color:var(--warn)}.ev.alerta{background:var(--danger-soft);color:var(--danger)}.ev.outro{background:var(--chip);color:var(--muted)}
.dc .dots{display:none;gap:3px}.dc .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}.dots i.supervisao{background:var(--warn)}.dots i.alerta{background:var(--danger)}.dots i.outro{background:var(--muted)}
#agBanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(62px + env(safe-area-inset-top));z-index:22;width:min(560px,94vw);border-radius:12px;padding:10px 12px;border:1px solid;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#agBanner.lvl1{background:var(--panel);border-color:var(--accent);color:var(--ink)}
#agBanner.lvl2{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
#agBanner.lvl3{background:var(--danger-soft);border:2px solid var(--danger);color:var(--ink);animation:alerta 1.2s ease-in-out infinite}
@keyframes alerta{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--danger) 35%,transparent)}}
#print{display:none}
/* ---------- celular ---------- */
@media(max-width:760px){
  body{font-size:15.5px}
  input,textarea,select{font-size:16px}
  header{padding-left:10px;padding-right:10px;gap:6px}
  header .bt{display:none}
  .flag{max-width:62vw}
  .wrap{flex-direction:column}
  nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:10;scrollbar-width:none}
  nav button{width:auto;white-space:nowrap;padding:8px 11px}
  main{padding:14px 12px 120px}
  .g6{grid-template-columns:1fr 1fr}
  .card{padding:12px}
  details.item>.body{padding:4px 10px 12px}
  dialog{padding:16px;width:calc(100% - 16px)}
  .lockbox{padding:20px}
  .fab{right:12px;padding:12px 16px}
  .dc{min-height:50px;align-items:center}.dc .ev,.dc .ref{display:none}.dc .dots{display:flex}
  .cal{gap:3px}
}
@media print{
  body{background:#fff}body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:11.5pt/1.45 Georgia,"Times New Roman",serif}
  #print h1{font-size:17pt;margin:0 0 4px}#print h3{font-size:12.5pt;margin:14px 0 6px}
  #print table{border-collapse:collapse;width:100%;margin:6px 0}#print td,#print th{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:left;font-size:10.5pt}
  #print tr.blank td{height:62px}#print .foot{margin-top:18px;font-size:9pt;color:#555}
}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Carregando…</p></div>
<aside id="ia" aria-label="Assistente de IA"></aside>
<dialog id="dlg"></dialog>
<dialog id="cdlg" class="cdlg"></dialog>
<div id="print"></div>
<input type="file" id="fileIn" accept=".tcc,.json,application/json" hidden>
<input type="file" id="upIn" multiple hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<noscript>Ative o JavaScript para usar o Kit Clínico TCC.</noscript>
<script src="kb.js"></script>
<script src="store.js"></script>
<script src="ia.js"></script>
<script src="app.js"></script>
<script src="agenda.js"></script>
</body>
</html>
